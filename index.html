    <title>Companion DomusDraconis</title>
    <!-- Il tema scelto prima che arrivi l'app, così la schermata di apertura non lampeggia (23/11) -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('companion-b20:tema') || 'null') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'notte' : 'giorno');
        document.documentElement.dataset.tema = t;
      } catch (e) {}
    </script>
    <!-- Schermata di apertura (23/11): solo HTML e CSS, nessuna libreria. Copre la prima apertura mentre arriva l'app;
         le volte dopo l'app è pronta in pochi decimi di secondo e la schermata sparisce subito. -->
    <style>
      #apertura { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(ellipse at 50% 40%, #FAF4E6 0%, #F3E9D2 55%, #E9DCC0 100%); color: #6E1A1A; transition: opacity .35s ease; }
      [data-tema='notte'] #apertura { background: radial-gradient(ellipse at 50% 40%, #3A2E26 0%, #241C17 55%, #1A1512 100%); color: #C9A253; }
      #apertura.via { opacity: 0; pointer-events: none; }
      #apertura svg { width: 88px; height: 88px; animation: d20 2.4s ease-in-out infinite; filter: drop-shadow(0 4px 10px rgba(110, 26, 26, .25)); }
      #apertura .nome { font-family: Georgia, 'Times New Roman', serif; font-size: 26px; letter-spacing: .08em; font-variant: small-caps; text-align: center; line-height: 1.2; }
      #apertura .nome small { display: block; font-size: 16px; letter-spacing: .12em; opacity: .85; }
      @keyframes d20 { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(180deg) scale(1.06); } 100% { transform: rotate(360deg) scale(1); } }
      @media (prefers-reduced-motion: reduce) { #apertura svg { animation: none; } #apertura { transition: none; } }
    </style>
  </head>
  <body>
    <div id="apertura" role="status" aria-label="Companion DomusDraconis si sta aprendo">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <g fill="none" stroke="#B08A3E" stroke-width="3" stroke-linejoin="round">
          <polygon points="50,4 90,27 90,73 50,96 10,73 10,27" fill="#B08A3E" fill-opacity=".12" />
          <polygon points="50,22 76,64 24,64" fill="#B08A3E" fill-opacity=".22" />
          <path d="M50 4 L50 22 M90 27 L76 64 M10 27 L24 64 M50 96 L76 64 M50 96 L24 64 M90 73 L76 64 M10 73 L24 64 M50 22 L90 27 M50 22 L10 27" />
        </g>
        <text x="50" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#B08A3E">20</text>
      </svg>
      <div class="nome">Companion<small>DomusDraconis</small></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
