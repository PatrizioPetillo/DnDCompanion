# Servizio degli sblocchi di Companion B20 (21/11): piano Workers gratuito, Durable Objects con SQLite.
name = "companion-b20-sblocchi"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[[durable_objects.bindings]]
name = "SBLOCCHI"
class_name = "Sblocco"

[[durable_objects.bindings]]
name = "CANALI"
class_name = "Canale"

[[durable_objects.bindings]]
name = "TAVOLI"
class_name = "TavoloDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sblocco"]

# 22/11: canale degli eventi dal master
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Canale"]


# 23/11: tavolo collegato (le schede dei giocatori arrivano al master)
[[migrations]]
tag = "v3"
new_sqlite_classes = ["TavoloDO"]
